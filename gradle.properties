# Example gradle.properties for 1.21.1 (compatible with 1.21.1-1.21.8)
minecraft_version=1.21.1
yarn_mappings=1.21.1+build.3
loader_version=0.16.9
fabric_api_version=0.102.1+1.21.1

mod_version=v6
maven_group=com.example
archives_base_name=IFN+AutoSell

# ---- Minecraft 26.1+ build (use: ./gradlew build -Plane=official, or ./build-all.ps1) ----
# The properties above are for the original 1.21.x build.
official_mod_version=v9
official_loader_version=0.20.1
loom_version=1.19-SNAPSHOT
official_minecraft_version=26.1
official_fabric_version=0.145.1+26.1
official_modmenu_version=18.0.2
# Which src/compat/<name> folder supplies the version-specific calls
official_compat=o1
# Minecraft versions written into fabric.mod.json
official_mc_range=>=26.1 <26.2
