plugins {
    id 'fabric-loom' version '1.10.1'
    id 'maven-publish'
    id 'java'
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

archivesBaseName = project.archives_base_name
version = project.mod_version
group = project.maven_group

repositories {
    maven { url = "https://maven.fabricmc.net/" }
    mavenCentral()

    // Cloth Config
    maven { url = "https://maven.shedaniel.me/" }

    // Mod Menu
    maven { url = "https://maven.terraformersmc.com/" }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:0.102.1+1.21.1"

    // Cloth Config (for config screen support)
    modImplementation "me.shedaniel.cloth:cloth-config-fabric:13.0.121"
    include "me.shedaniel.cloth:cloth-config-fabric:13.0.121"

    // Mod Menu (for config integration button)
    modImplementation "com.terraformersmc:modmenu:11.0.1"
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories { }
}
